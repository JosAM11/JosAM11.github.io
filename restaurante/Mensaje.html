<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario de contacto con el restaurante">
    <meta name="keywords" content="restaurante, contacto, mensaje, dudas">
    <title>Contacto - Restaurante</title>
</head>
<body>

    <header>
        <h1>Restaurante</h1>
</header>

<main>
<h4>Enviemos su mensaje</h4>

<from action="#" method="post">
<p>Su nombre <input type="text" name="nombre" placeholder="Su nombre"></p>
<p>Su correo electronico <input type="email" name="email" placeholder="Su correo electronico"></p>
<p>Su telefono <input type="tel" name="telefono" placeholder="Su telefono"></p>
<p>Asunto <input type="text" name="asunto" placeholder="Asunto"></p>
<p>Su mensaje <br>
<textarea name="mensaje" rows="6" cols="50" placeholder="Su mensaje" maxlength="500"></textarea>
</p>

<p>
                <input type="submit" value="Enviar reseña">
                <input type="reset" value="Limpiar">
            </p>

</from>
</main>

<footer>
        <a href="index.html">Volver al Inicio</a>
    </footer>

</body>
</html>
