<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tu Nombre">
    <meta name="description" content="Formulario para dejar una reseña de un plato">
    <meta name="keywords" content="restaurante, reseña, platos, opiniones">
    <title>Reseña - Restaurante</title>
</head>
<body>

    <header>
        <h1>Restaurante</h1>
        </header>

<main>
<h4>Reseña de un plato</h4>

<form action="#" method="post"></form>
<p>Plato:
<select name="plato">
<option value="Croquetas">Croquetas</option>
<option value="gazpacho">Gazpacho</option>
<option value="tortillapatatas">Tortilla de patatas</option>
</select>
</p>
<p>Nombre: <input type="text" name="nombre" placeholder="Su nombre"></p>

<p>Reseña del plato: <br>
<textarea name="resena" rows="5" cols="50" placeholder="Escriba aquí su reseña"></textarea>
</p>

<p>
                <input type="submit" value="Enviar reseña">
                <input type="reset" value="Limpiar">
            </p>
        </form>
    </main>

    <footer>
        <a href="index.html">Volver al Inicio</a>
    </footer>

</body>
</html>
